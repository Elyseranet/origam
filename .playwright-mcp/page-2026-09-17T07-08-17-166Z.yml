                - list [ref=f13e1516]:
                  - listitem [ref=f13e1517]:
                    - generic [aria-hidden] [ref=f13e1521]: 󰙨
                    - generic [ref=f13e1522]:
                      - strong [ref=f13e1523]: Élargir la barrière e2e en CI
                      - paragraph [ref=f13e1524]: 229 fichiers de specs couvrent déjà les familles de composants, mais le job de CI n'en exécute que les 58 déclarés verts. Faire entrer les 171 restants dans la barrière, vague par vague, en traitant les instabilités au lieu de les contourner.
                    - generic "Effort" [ref=f13e1525]: L
                  - listitem [ref=f13e1527]:
                    - generic [aria-hidden] [ref=f13e1531]: 󰱽
                    - generic [ref=f13e1532]:
                      - strong [ref=f13e1533]: Audit d'API avant la v3
                      - paragraph [ref=f13e1534]: "Le guide de migration v2 vers v3 n'existe pas encore, et l'écrire est une condition bloquante avant de poser le tag v3 : inventaire exhaustif des dépréciations, marqueurs @deprecated manquants complétés, et codemod pour les renommages mécaniques."
                    - generic "Effort" [ref=f13e1535]: L
                  - listitem [ref=f13e1537]:
                    - generic [aria-hidden] [ref=f13e1541]: 󰖟
                    - generic [ref=f13e1542]:
                      - strong [ref=f13e1543]: Publier la documentation sous le domaine du projet
                      - paragraph [ref=f13e1544]: La référence VitePress et le build Histoire sont en ligne et répondent en HTTP 200, mais sur un hôte interne. Tant qu'ils ne vivent pas sous le domaine du projet, le marketing n'a aucune adresse où envoyer les gens.
                    - generic "Effort" [ref=f13e1545]: S
                  - listitem [ref=f13e1547]:
                    - generic [aria-hidden] [ref=f13e1551]: 󱎍
                    - generic [ref=f13e1552]:
                      - strong [ref=f13e1553]: Audit d'accessibilité des overlays
                      - paragraph [ref=f13e1554]: Le balayage axe sur chaque story de composant existe mais ne tourne dans aucun job de CI, et son seuil d'échec est abaissé au seul niveau critique. Le piège au focus, sa restitution, aria-modal et la touche Échap ne sont assertés que pour Dialog, Select et la palette de commandes — Menu, menu contextuel, Tooltip, Drawer, Sheet et Snackbar n'en ont aucun.
                    - generic "Effort" [ref=f13e1555]: M
                  - listitem [ref=f13e1557]:
                    - generic [aria-hidden] [ref=f13e1561]: 󰳈
                    - generic [ref=f13e1562]:
                      - strong [ref=f13e1563]: SonarQube — résorber la dette restante
                      - paragraph [ref=f13e1564]: "La couverture des tests unitaires alimente le scan et la quality gate est armée : elle bloque sur la sécurité et la criticité. Reste le verdict lui-même — une note A sur les quatre axes et zéro dette ouverte. L'analyse des pull requests reste hors périmètre tant que le serveur tourne en Community Edition, qui n'analyse qu'une seule branche."
                    - generic "Effort" [ref=f13e1565]: M
                  - listitem [ref=f13e1567]:
