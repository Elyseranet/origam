  - main [ref=f5e58]:
    - article [ref=f5e60]:
      - region [ref=f5e61]:
        - generic [ref=f5e62]:
          - generic [ref=f5e63]: Un seul mainteneur
          - heading "Contact" [level=1] [ref=f5e65]
          - paragraph [ref=f5e66]: origam est maintenu par un seul développeur. Tout passe par GitHub, à découvert — une question posée là-bas aide la personne suivante qui la cherchera, et rien ne s’enterre dans une boîte mail.
      - region [ref=f5e67]:
        - generic [ref=f5e68]:
          - heading "Signaler un bug" [level=2] [ref=f5e69]
          - paragraph [ref=f5e70]: Ouvrez un ticket sur le dépôt. Un rapport utile nomme le composant, la version d’origam, ce que vous attendiez et ce qui s’est produit à la place — une reproduction minimale vaut mieux qu’un paragraphe de description.
          - link "Ouvrir un ticket sur GitHub" [ref=f5e71] [cursor=pointer]:
            - /url: https://github.com/Elyseranet/origam/issues
      - region [ref=f5e74]:
        - generic [ref=f5e75]:
          - heading "Poser une question" [level=2] [ref=f5e76]
          - paragraph [ref=f5e77]: "Utilisez les discussions du dépôt pour tout ce qui n’est pas une anomalie : comment utiliser un composant, une idée de composant qui n’existe pas encore, ou un retour sur la documentation."
          - link "Ouvrir une discussion sur GitHub" [ref=f5e78] [cursor=pointer]:
            - /url: https://github.com/Elyseranet/origam/discussions
      - region [ref=f5e81]:
        - generic [ref=f5e82]:
          - heading "Soutenir le projet" [level=2] [ref=f5e83]
          - paragraph [ref=f5e84]: origam est gratuit et sous licence MIT. S’il vous fait gagner du temps, la page de soutien explique comment un don finance le travail de maintenance.
          - link "Aller à la page de soutien" [ref=f5e85] [cursor=pointer]:
            - /url: /fr/support
      - region [ref=f5e88]:
        - generic [ref=f5e89]:
          - heading "Il n’y a pas d’adresse de support" [level=2] [ref=f5e90]
          - separator [ref=f5e91]
          - paragraph [ref=f5e92]: "Ce projet ne publie aucune adresse e-mail, et aucune n’est dissimulée derrière un formulaire sur ce site. Les demandes faites à découvert reçoivent une réponse à découvert : il n’y a pas de canal privé, ni d’engagement sur le délai de réponse."
