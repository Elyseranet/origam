                  - generic [ref=f11e313]: Smaller community
                - generic [ref=f11e315]: Vuetify and PrimeVue have years of production usage, thousands of Stack Overflow answers, and rich third-party template markets. origam doesn't — yet.
            - listitem [ref=f11e317]:
