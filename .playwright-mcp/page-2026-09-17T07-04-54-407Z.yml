                  - generic [aria-hidden] [ref=f11e336]: 󰒍
                  - generic [ref=f11e337]: Less battle-tested at scale
                - generic [ref=f11e339]: We haven't been stress-tested in apps with hundreds of devs and millions of daily users. If that's your situation, factor this in.
