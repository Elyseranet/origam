  - main [ref=f11e58]:
    - article [ref=f11e60]:
      - region [ref=f11e61]:
        - generic [ref=f11e62]:
          - generic [ref=f11e63]: Honest by design
          - heading "Why origam? An honest answer." [level=1] [ref=f11e65]:
            - generic [ref=f11e66]: Why origam?
            - generic [ref=f11e67]: An honest answer.
          - paragraph [ref=f11e68]: We built origam for Vue 3 teams who care about design quality, accessibility, and token-driven consistency. Here's what we do well — and where we're still growing.
      - region [ref=f11e69]:
        - generic [ref=f11e70]:
          - generic [ref=f11e71]:
            - paragraph [ref=f11e72]: WHAT WE DO WELL
            - heading "Built for Vue 3. From the ground up." [level=2] [ref=f11e73]:
              - generic [ref=f11e74]: Built for Vue 3.
              - generic [ref=f11e75]: From the ground up.
            - paragraph [ref=f11e76]: Every API, every composable, every prop — designed for Composition API and TypeScript from day one.
          - list [ref=f11e77]:
            - listitem [ref=f11e78]:
              - generic [ref=f11e79]:
                - generic [ref=f11e80]:
                  - generic [aria-hidden] [ref=f11e85]: 󰡄
                  - generic [ref=f11e86]: Vue 3 native
                - generic [ref=f11e88]: Built with Composition API and script setup. No legacy Options API shim, no Vue 2 baggage — just clean, idiomatic Vue 3.
            - listitem [ref=f11e90]:
              - generic [ref=f11e91]:
                - generic [ref=f11e92]:
                  - generic [aria-hidden] [ref=f11e97]: 󰸌
                  - generic [ref=f11e98]: Design tokens DTCG
                - generic [ref=f11e100]: Tokens Studio-compatible, Style Dictionary v4. 8 themes switch at runtime with zero remount and zero flicker.
            - listitem [ref=f11e102]:
              - generic [ref=f11e103]:
                - generic [ref=f11e104]:
                  - generic [aria-hidden] [ref=f11e109]: 󰄪
                  - generic [ref=f11e110]: 218 components + 26 chart primitives
                - generic [ref=f11e112]: From atomic buttons to line, area, donut, heatmap and candlestick charts — all in one coherent package.
            - listitem [ref=f11e114]:
              - generic [ref=f11e115]:
                - generic [ref=f11e116]:
                  - generic [aria-hidden] [ref=f11e121]: 󰋦
                  - generic [ref=f11e122]: WCAG 2.1 AA verified
                - generic [ref=f11e124]: "axe-core + Playwright a11y tests ship with every component. Keyboard, screen-readers and reduced-motion: covered."
            - listitem [ref=f11e126]:
              - generic [ref=f11e127]:
                - generic [ref=f11e128]:
                  - generic [aria-hidden] [ref=f11e133]: 󰌜
                  - generic [ref=f11e134]: CSS-first architecture
                - generic [ref=f11e136]: Container queries, :has(), color-mix(), view-transition-name. We use the platform so your bundle doesn't pay for polyfills.
            - listitem [ref=f11e138]:
              - generic [ref=f11e139]:
                - generic [ref=f11e140]:
                  - generic [aria-hidden] [ref=f11e145]: 󰏗
                  - generic [ref=f11e146]: < 50 kb tree-shakable
                - generic [ref=f11e148]: ESM-first build. Import what you use; the rest never reaches your users.
            - listitem [ref=f11e150]:
