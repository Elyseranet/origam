                    - generic [ref=f13e680]:
                      - strong [ref=f13e681]: Vue Vapor mode (exploratory)
                      - paragraph [ref=f13e682]: No-virtual-DOM compilation — ~40 % less runtime overhead. POC on 5 pivot components, benchmarks first.
                    - generic "Effort" [ref=f13e683]: XL
                  - listitem [ref=f13e685]:
