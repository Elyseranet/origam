                      - paragraph [ref=f13e692]: origam/elements sub-export via defineCustomElement. Cross-framework demo (React, Svelte, Angular).
                    - generic "Effort" [ref=f13e693]: L
                  - listitem [ref=f13e695]:
                    - generic [aria-hidden] [ref=f13e699]: 󱍜
                    - generic [ref=f13e700]:
                      - strong [ref=f13e701]: Theme Builder UI
                      - paragraph [ref=f13e702]: "Standalone app consuming origam itself: edit primitive tokens, preview components in real time, export brand JSON."
                    - generic "Effort" [ref=f13e703]: XL
                  - listitem [ref=f13e705]:
                    - generic [aria-hidden] [ref=f13e709]: 󱘸
                    - generic [ref=f13e710]:
                      - strong [ref=f13e711]: Marketing — database + auto DS sync
                      - paragraph [ref=f13e712]: Persist the whole reference catalogue (components, composables, types, enums, interfaces, utils, consts) in a database (Nitro + TypeORM / PostgreSQL) instead of static glob files. A sync job reads the DS source and upserts the DB on every release, so the reference docs follow the design system automatically. Editorial content lives in the same tables with a DS-auto vs edited flag.
                    - generic "Effort" [ref=f13e713]: XL
                  - listitem [ref=f13e715]:
                    - generic [aria-hidden] [ref=f13e719]: 󱥈
                    - generic [ref=f13e720]:
                      - strong [ref=f13e721]: Marketing — admin backend (CMS)
                      - paragraph [ref=f13e722]: "A back-office to manage all site content when auto-generation falls short: edit any page (reference + editorial), reorder, publish/hide, without touching code. Fully translatable (DB-driven i18n, per-locale completeness) and built with origam itself — a full-scale DS showcase. Auth + roles, change audit, pre-publish guardrail. Stack: Nitro + TypeORM/PostgreSQL + Redis."
                    - generic "Effort" [ref=f13e723]: XL
