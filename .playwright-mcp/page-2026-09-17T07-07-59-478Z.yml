                      - strong [ref=f13e783]: Documentation coverage
                      - paragraph [ref=f13e784]: No component merges without its doc page. Quarterly audit of the documentation links.
                  - listitem [ref=f13e785]:
                    - generic [aria-hidden] [ref=f13e789]: 󰓅
                    - generic [ref=f13e790]:
                      - strong [ref=f13e791]: Performance budget
                      - paragraph [ref=f13e792]: Bundle-size checks block any PR that exceeds its budget; every changed component is profiled before merge.
                  - listitem [ref=f13e793]:
                    - generic [aria-hidden] [ref=f13e797]: 󰃢
                    - generic [ref=f13e798]:
                      - strong [ref=f13e799]: Boy-scout refactors
                      - paragraph [ref=f13e800]: Any PR touching a component with legacy patterns (hardcoded colors, inline-only styling) migrates it before merge.
                  - listitem [ref=f13e801]:
                    - generic [aria-hidden] [ref=f13e805]: 󱝀
                    - generic [ref=f13e806]:
