            - paragraph [ref=f13e405]: WHAT'S NEXT
            - heading "A phased roadmap." [level=2] [ref=f13e406]
            - paragraph [ref=f13e407]: Each phase builds on the previous. The order reflects real technical dependencies, not arbitrary milestones.
          - list "A phased roadmap." [ref=f13e408]:
            - listitem [ref=f13e409]:
              - generic [aria-hidden] [ref=f13e412]: 󱓟
              - generic [ref=f13e415]:
                - generic [ref=f13e419]:
                  - generic [ref=f13e420]: Q3 2026
                  - heading "Short term" [level=3] [ref=f13e422]
                - list [ref=f13e424]:
                  - listitem [ref=f13e425]:
                    - generic [aria-hidden] [ref=f13e429]: 󰙨
                    - generic [ref=f13e430]:
                      - strong [ref=f13e431]: Widen the e2e gate in CI
                      - paragraph [ref=f13e432]: 229 spec files already cover the component families, but the CI job runs only the 58 listed as green. Bring the remaining 171 into the gate, wave by wave, fixing the instability instead of skipping it.
                    - generic "Effort" [ref=f13e433]: L
                  - listitem [ref=f13e435]:
                    - generic [aria-hidden] [ref=f13e439]: 󰱽
                    - generic [ref=f13e440]:
                      - strong [ref=f13e441]: Pre-v3 API audit
                      - paragraph [ref=f13e442]: "The v2-to-v3 migration guide does not exist yet, and writing it is a blocking condition before v3 can be tagged: a full deprecation inventory, the missing @deprecated markers completed, and a codemod for the mechanical renames."
                    - generic "Effort" [ref=f13e443]: L
                  - listitem [ref=f13e445]:
                    - generic [aria-hidden] [ref=f13e449]: 󰖟
                    - generic [ref=f13e450]:
                      - strong [ref=f13e451]: Publish the docs under the project domain
                      - paragraph [ref=f13e452]: The VitePress reference and the Histoire build are online and answer HTTP 200, but on an internal host. Until they live under the project domain, marketing has no address to send people to.
                    - generic "Effort" [ref=f13e453]: S
                  - listitem [ref=f13e455]:
                    - generic [aria-hidden] [ref=f13e459]: 󱎍
                    - generic [ref=f13e460]:
                      - strong [ref=f13e461]: Overlay a11y audit
                      - paragraph [ref=f13e462]: The axe sweep over every component story exists but runs in no CI job, and its failure threshold is lowered to critical only. Focus trap, focus restoration, aria-modal and Escape are asserted for Dialog, Select and the command palette — Menu, contextual menu, Tooltip, Drawer, Sheet and Snackbar have none.
                    - generic "Effort" [ref=f13e463]: M
                  - listitem [ref=f13e465]:
                    - generic [aria-hidden] [ref=f13e469]: 󰳈
                    - generic [ref=f13e470]:
                      - strong [ref=f13e471]: SonarQube — clear the remaining debt
                      - paragraph [ref=f13e472]: "Unit-test coverage is wired into the scan and the quality gate is armed, blocking on security and critical issues. What remains is the verdict itself: an A rating on all four axes and zero open debt. Pull-request analysis stays out of scope while the server runs Community Edition, which analyses a single branch."
                    - generic "Effort" [ref=f13e473]: M
                  - listitem [ref=f13e475]:
                    - generic [aria-hidden] [ref=f13e479]: 󰏗
                    - generic [ref=f13e480]:
                      - strong [ref=f13e481]: Bundle-size monitoring
                      - paragraph [ref=f13e482]: No size budget is enforced today. Add size-limit on every sub-export with automatic pull-request comments, and set the threshold from the current measurement — the 2.17.1 tarball weighs 1.73 MB.
                    - generic "Effort" [ref=f13e483]: S
            - listitem [ref=f13e485]:
              - generic [aria-hidden] [ref=f13e488]: 󰧾
              - generic [ref=f13e491]:
                - generic [ref=f13e495]:
                  - generic [ref=f13e496]: Q4 2026 / Q1 2027
                  - heading "Mid term" [level=3] [ref=f13e498]
                - list [ref=f13e500]:
                  - listitem [ref=f13e501]:
                    - generic [aria-hidden] [ref=f13e505]: 󱐌
                    - generic [ref=f13e506]:
                      - strong [ref=f13e507]: v3.0.0 — Strategy B
                      - paragraph [ref=f13e508]: Remove *Styles returns when the value is tokenised. Utility classes become the sole API. ~2× less reactive computation.
                    - generic "Effort" [ref=f13e509]: XL
                  - listitem [ref=f13e511]:
                    - generic [aria-hidden] [ref=f13e515]: 󰩦
                    - generic [ref=f13e516]:
                      - strong [ref=f13e517]: Modular sub-exports (origam/core, origam/form, origam/chart, …)
                      - paragraph [ref=f13e518]: Split the published library into tree-shakable sub-exports by domain, so an app only pays for what it actually imports. The existing origam barrel stays available for backward compatibility.
                    - generic "Effort" [ref=f13e519]: XL
                  - listitem [ref=f13e521]:
                    - generic [aria-hidden] [ref=f13e525]: 󰸌
                    - generic [ref=f13e526]:
                      - strong [ref=f13e527]: accentColor rename (breaking v3)
                      - paragraph [ref=f13e528]: bgColor → accentColor prop rename, aligned with the CSS accent-color standard. Full deprecation path included.
                    - generic "Effort" [ref=f13e529]: M
                  - listitem [ref=f13e531]:
                    - generic [aria-hidden] [ref=f13e535]: 󰉹
                    - generic [ref=f13e536]:
                      - strong [ref=f13e537]: Semantic list variants (OrigamList)
                      - paragraph [ref=f13e538]: OrigamList / OrigamListItem render div role="listbox" today. A new variant prop (unordered → ul/li, ordered → ol/li, nav, listbox) will emit real ul/ol/li semantics, replacing the boolean nav prop.
                    - generic "Effort" [ref=f13e539]: M
                  - listitem [ref=f13e541]:
                    - generic [aria-hidden] [ref=f13e545]: 󰓍
                    - generic [ref=f13e546]:
                      - strong [ref=f13e547]: OrigamWizardForm — multi-step form
                      - paragraph [ref=f13e548]: Composes the existing OrigamForm and OrigamStepper — no reimplementation of validation or step navigation. Per-step validation blocks progression until the active step is valid; a single v-model aggregates every step's values.
                    - generic "Effort" [ref=f13e549]: M
                  - listitem [ref=f13e551]:
                    - generic [aria-hidden] [ref=f13e555]: 󰽿
                    - generic [ref=f13e556]:
                      - strong [ref=f13e557]: OrigamPage — page wrapper
                      - paragraph [ref=f13e558]: A deliberately simple structural wrapper with three optional zones — header, content, footer — rendered as real semantic elements. No imposed scroll or sticky behaviour, just a consistent page skeleton on top of the DS spacing tokens.
                    - generic "Effort" [ref=f13e559]: S
                  - listitem [ref=f13e561]:
                    - generic [aria-hidden] [ref=f13e565]: 󱇘
                    - generic [ref=f13e566]:
                      - strong [ref=f13e567]: OrigamSection — section schemas
                      - paragraph [ref=f13e568]: "OrigamSection was removed from the repository on 2026-08-26 — it was an empty 14-line shell with no shipped value. This milestone creates it from scratch: predefined section schemas such as hero, split, centered or full-bleed, as overridable prop presets on a real section element, props-first."
                    - generic "Effort" [ref=f13e569]: M
                  - listitem [ref=f13e571]:
                    - generic [aria-hidden] [ref=f13e575]: 󰪐
                    - generic [ref=f13e576]:
                      - strong [ref=f13e577]: Motion & a11y media tokens
                      - paragraph [ref=f13e578]: tokens/semantic/motion.json — durations, easings. Auto 0ms if prefers-reduced-motion. High-contrast ramp.
                    - generic "Effort" [ref=f13e579]: M
                  - listitem [ref=f13e581]:
                    - generic [aria-hidden] [ref=f13e585]: 󰋯
                    - generic [ref=f13e586]:
                      - strong [ref=f13e587]: v-background directive
                      - paragraph [ref=f13e588]: Compose one or several backgrounds on any element — image or color gradient (tokenised intents + custom). Per-layer position, size, repeat and a simple mask. Each layer renders as a pseudo-element (default, zero extra DOM) or an injected div, switchable in the directive config.
                    - generic "Effort" [ref=f13e589]: L
                  - listitem [ref=f13e591]:
                    - generic [aria-hidden] [ref=f13e595]: 󰚞
                    - generic [ref=f13e596]:
                      - strong [ref=f13e597]: TextMask — colored stroke & fill
                      - paragraph [ref=f13e598]: "Extend OrigamTextMask with an outlined mode: transparent text with a colored per-letter stroke (-webkit-text-stroke) and/or a distinct fill, for outline-only and contrasted headline effects. Stays real, selectable text; CSS-first with a solid fallback."
                    - generic "Effort" [ref=f13e599]: M
                  - listitem [ref=f13e601]:
                    - generic [aria-hidden] [ref=f13e605]: 󱍜
                    - generic [ref=f13e606]:
                      - strong [ref=f13e607]: Complete the /theming builder
                      - paragraph [ref=f13e608]: "The marketing theme builder shipped as a partial V1 (~14 core components, tokens capped, modals/slot-driven not previewable). Finish it: cover all editable components, handle overlay/slot-driven previews, lift the token cap, and rework the UI — the current ergonomics are clearly not good enough. Stays data-driven and DS-first."
                    - generic "Effort" [ref=f13e609]: L
                  - listitem [ref=f13e611]:
                    - generic [ref=f13e614]:
                      - strong [ref=f13e615]: Visual regression testing
                      - paragraph [ref=f13e616]: Playwright toHaveScreenshot() per Variant, or Chromatic / Lost-Pixel. Baseline on main, diff blocks PR.
                    - generic "Effort" [ref=f13e617]: M
                  - listitem [ref=f13e619]:
                    - generic [aria-hidden] [ref=f13e623]: 󱎯
                    - generic [ref=f13e624]:
                      - strong [ref=f13e625]: Turborepo build cache
                      - paragraph [ref=f13e626]: Replace raw pnpm -r scripts with Turborepo pipelines. Remote cache drastically cuts CI rebuild time.
                    - generic "Effort" [ref=f13e627]: S
                  - listitem [ref=f13e629]:
                    - generic [aria-hidden] [ref=f13e633]: 󱕂
                    - generic [ref=f13e634]:
                      - strong [ref=f13e635]: variant as a preset of real props
                      - paragraph [ref=f13e636]: Turn each visual variant into a transparent, fully overridable preset of component props instead of hardcoded styling — piloted on OrigamBlockquote, then generalized.
                    - generic "Effort" [ref=f13e637]: L
                  - listitem [ref=f13e639]:
                    - generic [aria-hidden] [ref=f13e643]: 󰐒
                    - generic [ref=f13e644]:
                      - strong [ref=f13e645]: OrigamAddMore — form field repeater
                      - paragraph [ref=f13e646]: A new form component for repeating a group of fields with an 'Add more' action, min/max bounds, and full keyboard and screen-reader support.
                    - generic "Effort" [ref=f13e647]: M
                  - listitem [ref=f13e649]:
                    - generic [aria-hidden] [ref=f13e653]: 󱇃
                    - generic [ref=f13e654]:
                      - strong [ref=f13e655]: OrigamBtn — contentJustify prop
                      - paragraph [ref=f13e656]: A props-first way to control how a button's content aligns inside its layout, for buttons that don't rely on the prepend/append icon slots.
                    - generic "Effort" [ref=f13e657]: S
