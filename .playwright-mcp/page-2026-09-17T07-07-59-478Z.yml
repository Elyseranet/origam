                      - paragraph [ref=f13e808]: Static analysis, strict linting, and type-checking run on every PR — no unexplained escape hatches.
                  - listitem [ref=f13e809]:
                    - generic [aria-hidden] [ref=f13e813]: 󰷉
                    - generic [ref=f13e814]:
                      - strong [ref=f13e815]: Changelog discipline
