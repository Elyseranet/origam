            - heading "A phased roadmap." [level=2] [ref=f3e346]
            - paragraph [ref=f3e347]: Each phase builds on the previous. The order reflects real technical dependencies, not arbitrary milestones.
          - list "A phased roadmap." [ref=f3e348]:
            - listitem [ref=f3e349]:
              - generic [aria-hidden] [ref=f3e352]: 󱓟
              - generic [ref=f3e355]:
