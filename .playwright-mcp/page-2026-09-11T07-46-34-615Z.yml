                    - generic [ref=f3e516]:
                      - strong [ref=f3e517]: Semantic list variants (OrigamList)
                      - paragraph [ref=f3e518]: OrigamList / OrigamListItem render div role="listbox" today. A new variant prop (unordered → ul/li, ordered → ol/li, nav, listbox) will emit real ul/ol/li semantics, replacing the boolean nav prop.
                    - generic "Effort" [ref=f3e519]: M
                  - listitem [ref=f3e521]:
                    - generic [aria-hidden] [ref=f3e525]: 󰓍
                    - generic [ref=f3e526]:
                      - strong [ref=f3e527]: OrigamWizardForm — multi-step form
                      - paragraph [ref=f3e528]: Composes the existing OrigamForm and OrigamStepper — no reimplementation of validation or step navigation. Per-step validation blocks progression until the active step is valid; a single v-model aggregates every step's values.
                    - generic "Effort" [ref=f3e529]: M
                  - listitem [ref=f3e531]:
                    - generic [aria-hidden] [ref=f3e535]: 󰽿
                    - generic [ref=f3e536]:
                      - strong [ref=f3e537]: OrigamPage — page wrapper
                      - paragraph [ref=f3e538]: A deliberately simple structural wrapper with three optional zones — header, content, footer — rendered as real semantic elements. No imposed scroll or sticky behaviour, just a consistent page skeleton on top of the DS spacing tokens.
                    - generic "Effort" [ref=f3e539]: S
                  - listitem [ref=f3e541]:
                    - generic [aria-hidden] [ref=f3e545]: 󱇘
                    - generic [ref=f3e546]:
                      - strong [ref=f3e547]: OrigamSection — section schemas
                      - paragraph [ref=f3e548]: "OrigamSection was removed from the repository on 2026-08-26 — it was an empty 14-line shell with no shipped value. This milestone creates it from scratch: predefined section schemas such as hero, split, centered or full-bleed, as overridable prop presets on a real section element, props-first."
                    - generic "Effort" [ref=f3e549]: M
