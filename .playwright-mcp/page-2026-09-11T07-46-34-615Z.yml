                      - strong [ref=f3e577]: TextMask — colored stroke & fill
                      - paragraph [ref=f3e578]: "Extend OrigamTextMask with an outlined mode: transparent text with a colored per-letter stroke (-webkit-text-stroke) and/or a distinct fill, for outline-only and contrasted headline effects. Stays real, selectable text; CSS-first with a solid fallback."
                    - generic "Effort" [ref=f3e579]: M
                  - listitem [ref=f3e581]:
                    - generic [aria-hidden] [ref=f3e585]: 󱍜
                    - generic [ref=f3e586]:
                      - strong [ref=f3e587]: Complete the /theming builder
                      - paragraph [ref=f3e588]: "The marketing theme builder shipped as a partial V1 (~14 core components, tokens capped, modals/slot-driven not previewable). Finish it: cover all editable components, handle overlay/slot-driven previews, lift the token cap, and rework the UI — the current ergonomics are clearly not good enough. Stays data-driven and DS-first."
                    - generic "Effort" [ref=f3e589]: L
                  - listitem [ref=f3e591]:
