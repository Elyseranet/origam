                    - generic [ref=f3e506]:
                      - strong [ref=f3e507]: accentColor rename (breaking v3)
                      - paragraph [ref=f3e508]: bgColor → accentColor prop rename, aligned with the CSS accent-color standard. Full deprecation path included.
