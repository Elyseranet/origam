                - list [ref=f3e364]:
                  - listitem [ref=f3e365]:
                    - generic [aria-hidden] [ref=f3e369]: 󰳈
                    - generic [ref=f3e370]:
                      - strong [ref=f3e371]: SonarQube — A rating, zero debt
                      - paragraph [ref=f3e372]: The Sonar scan is already wired (build.yml + sonar-project.properties) but incomplete. Feed the Vitest lcov coverage into Sonar (sonar.javascript.lcov.reportPaths), enable a blocking quality gate, and clear every bug / vulnerability / security hotspot / code smell to reach an A rating on all axes with zero technical debt. Run on PRs and add it to the pre-delivery checks.
                    - generic "Effort" [ref=f3e373]: M
                  - listitem [ref=f3e375]:
                    - generic [aria-hidden] [ref=f3e379]: 󰳦
                    - generic [ref=f3e380]:
                      - strong [ref=f3e381]: CI E2E — job cancelled on every run
                      - paragraph [ref=f3e382]: "The Playwright E2E job is cancelled on every CI run (the 5 other jobs pass): it exceeds its 30-min timeout even on the green subset. Cause: the Playwright webServer runs Histoire in Vite DEV mode, which compiles each story on first access (19-30 s cold-start per story) — too slow on a fresh runner. Decide: fix by pointing the e2e webServer at the static Histoire build already produced by build:embeds (public/stories, served via http-server — no Vite cold-start), or make the e2e job non-blocking / move it to a separate nightly workflow until then."
                    - generic "Effort" [ref=f3e383]: M
                  - listitem [ref=f3e385]:
                    - generic [aria-hidden] [ref=f3e389]: 󰊤
                    - generic [ref=f3e390]:
                      - strong [ref=f3e391]: Complete CI / CD pipeline
                      - paragraph [ref=f3e392]: "GitHub Actions: lint, token:lint, unit tests, e2e, build on every PR. Automated publish on tag v*."
                    - generic "Effort" [ref=f3e393]: L
                  - listitem [ref=f3e395]:
                    - generic [aria-hidden] [ref=f3e399]: 󰭾
                    - generic [ref=f3e400]:
                      - strong [ref=f3e401]: Deploy VitePress + Histoire
                      - paragraph [ref=f3e402]: Docs on origam.dev, stories on stories.origam.dev. Blocks all external adoption.
                    - generic "Effort" [ref=f3e403]: M
                  - listitem [ref=f3e405]:
                    - generic [aria-hidden] [ref=f3e409]: 󰙨
                    - generic [ref=f3e410]:
                      - strong [ref=f3e411]: Full Playwright coverage
                      - paragraph [ref=f3e412]: 100 % of public components covered — one spec per component exercising every Variant and prop.
