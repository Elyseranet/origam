                    - generic [ref=f3e430]:
                      - strong [ref=f3e431]: Bundle-size monitoring
                      - paragraph [ref=f3e432]: size-limit on every sub-export. PR comments auto-generated. The 5.6 MB → 869 kB drop must stay an asset.
                    - generic "Effort" [ref=f3e433]: S
