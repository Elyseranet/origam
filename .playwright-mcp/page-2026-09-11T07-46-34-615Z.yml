                      - paragraph [ref=f3e690]: Persist the whole reference catalogue (components, composables, types, enums, interfaces, utils, consts) in a database (Nitro + TypeORM / PostgreSQL) instead of static glob files. A sync job reads the DS source and upserts the DB on every release, so the reference docs follow the design system automatically. Editorial content lives in the same tables with a DS-auto vs edited flag.
                    - generic "Effort" [ref=f3e691]: XL
