                      - strong [ref=f3e567]: v-background directive
                      - paragraph [ref=f3e568]: Compose one or several backgrounds on any element — image or color gradient (tokenised intents + custom). Per-layer position, size, repeat and a simple mask. Each layer renders as a pseudo-element (default, zero extra DOM) or an injected div, switchable in the directive config.
                    - generic "Effort" [ref=f3e569]: L
