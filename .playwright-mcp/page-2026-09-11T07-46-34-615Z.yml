                      - strong [ref=f3e603]: Turborepo build cache
                      - paragraph [ref=f3e604]: Replace raw pnpm -r scripts with Turborepo pipelines. Remote cache drastically cuts CI rebuild time.
                    - generic "Effort" [ref=f3e605]: S
