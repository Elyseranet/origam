        - generic [ref=f6e62]:
          - generic [ref=f6e63]: One maintainer
          - heading "Contact" [level=1] [ref=f6e65]
          - paragraph [ref=f6e66]: origam is maintained by one developer. Everything goes through GitHub, in the open — a question asked there helps the next person who searches for it, and nothing gets buried in a mailbox.
      - region [ref=f6e67]:
        - generic [ref=f6e68]:
          - heading "Report a bug" [level=2] [ref=f6e69]
          - paragraph [ref=f6e70]: Open an issue on the repository. A useful report names the component, the version of origam, what you expected and what happened instead — a minimal reproduction is worth more than a paragraph of description.
          - link "Open an issue on GitHub" [ref=f6e71] [cursor=pointer]:
            - /url: https://github.com/Elyseranet/origam/issues
      - region [ref=f6e74]:
        - generic [ref=f6e75]:
          - heading "Ask a question" [level=2] [ref=f6e76]
          - paragraph [ref=f6e77]: "Use the discussions of the repository for anything that is not a defect: how to use a component, an idea for one that does not exist yet, or feedback on the documentation."
          - link "Open a discussion on GitHub" [ref=f6e78] [cursor=pointer]:
            - /url: https://github.com/Elyseranet/origam/discussions
      - region [ref=f6e81]:
        - generic [ref=f6e82]:
          - heading "Support the project" [level=2] [ref=f6e83]
          - paragraph [ref=f6e84]: origam is free and MIT-licensed. If it saves you time, the support page explains how a donation funds the maintenance work.
          - link "Go to the support page" [ref=f6e85] [cursor=pointer]:
            - /url: /support
      - region [ref=f6e88]:
        - generic [ref=f6e89]:
          - heading "There is no support address" [level=2] [ref=f6e90]
          - separator [ref=f6e91]
          - paragraph [ref=f6e92]: "This project publishes no email address, and none is hidden behind a form on this site. Requests made in the open are answered in the open: there is no private channel, and no commitment on response time."
