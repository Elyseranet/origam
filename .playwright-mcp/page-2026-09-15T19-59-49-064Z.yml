                      - strong [ref=f8e461]: Automated dependency updates
                      - paragraph [ref=f8e462]: Renovate with grouped update policies, automatic merges for patch-level dev dependencies, and a weekly grouped PR for minor bumps.
                    - generic "Effort" [ref=f8e463]: S
