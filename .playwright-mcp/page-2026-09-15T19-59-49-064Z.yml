                      - strong [ref=f8e577]: TextMask — colored stroke & fill
                      - paragraph [ref=f8e578]: "Extend OrigamTextMask with an outlined mode: transparent text with a colored per-letter stroke (-webkit-text-stroke) and/or a distinct fill, for outline-only and contrasted headline effects. Stays real, selectable text; CSS-first with a solid fallback."
                    - generic "Effort" [ref=f8e579]: M
                  - listitem [ref=f8e581]:
                    - generic [aria-hidden] [ref=f8e585]: 󱍜
                    - generic [ref=f8e586]:
                      - strong [ref=f8e587]: Complete the /theming builder
                      - paragraph [ref=f8e588]: "The marketing theme builder shipped as a partial V1 (~14 core components, tokens capped, modals/slot-driven not previewable). Finish it: cover all editable components, handle overlay/slot-driven previews, lift the token cap, and rework the UI — the current ergonomics are clearly not good enough. Stays data-driven and DS-first."
                    - generic "Effort" [ref=f8e589]: L
                  - listitem [ref=f8e591]:
                    - generic [ref=f8e592]:
                      - strong [ref=f8e593]: Visual regression testing
                      - paragraph [ref=f8e594]: Playwright toHaveScreenshot() per Variant, or Chromatic / Lost-Pixel. Baseline on main, diff blocks PR.
                    - generic "Effort" [ref=f8e595]: M
                  - listitem [ref=f8e597]:
                    - generic [aria-hidden] [ref=f8e601]: 󱎯
                    - generic [ref=f8e602]:
                      - strong [ref=f8e603]: Turborepo build cache
                      - paragraph [ref=f8e604]: Replace raw pnpm -r scripts with Turborepo pipelines. Remote cache drastically cuts CI rebuild time.
                    - generic "Effort" [ref=f8e605]: S
