                    - generic [ref=f8e496]:
                      - strong [ref=f8e497]: Modular sub-exports (origam/core, origam/form, origam/chart, …)
                      - paragraph [ref=f8e498]: Split the published library into tree-shakable sub-exports by domain, so an app only pays for what it actually imports. The existing origam barrel stays available for backward compatibility.
                    - generic "Effort" [ref=f8e499]: XL
                  - listitem [ref=f8e501]:
                    - generic [aria-hidden] [ref=f8e505]: 󰸌
                    - generic [ref=f8e506]:
                      - strong [ref=f8e507]: accentColor rename (breaking v3)
                      - paragraph [ref=f8e508]: bgColor → accentColor prop rename, aligned with the CSS accent-color standard. Full deprecation path included.
                    - generic "Effort" [ref=f8e509]: M
                  - listitem [ref=f8e511]:
                    - generic [aria-hidden] [ref=f8e515]: 󰉹
                    - generic [ref=f8e516]:
                      - strong [ref=f8e517]: Semantic list variants (OrigamList)
                      - paragraph [ref=f8e518]: OrigamList / OrigamListItem render div role="listbox" today. A new variant prop (unordered → ul/li, ordered → ol/li, nav, listbox) will emit real ul/ol/li semantics, replacing the boolean nav prop.
                    - generic "Effort" [ref=f8e519]: M
                  - listitem [ref=f8e521]:
                    - generic [aria-hidden] [ref=f8e525]: 󰓍
                    - generic [ref=f8e526]:
                      - strong [ref=f8e527]: OrigamWizardForm — multi-step form
                      - paragraph [ref=f8e528]: Composes the existing OrigamForm and OrigamStepper — no reimplementation of validation or step navigation. Per-step validation blocks progression until the active step is valid; a single v-model aggregates every step's values.
                    - generic "Effort" [ref=f8e529]: M
                  - listitem [ref=f8e531]:
                    - generic [aria-hidden] [ref=f8e535]: 󰽿
                    - generic [ref=f8e536]:
                      - strong [ref=f8e537]: OrigamPage — page wrapper
                      - paragraph [ref=f8e538]: A deliberately simple structural wrapper with three optional zones — header, content, footer — rendered as real semantic elements. No imposed scroll or sticky behaviour, just a consistent page skeleton on top of the DS spacing tokens.
                    - generic "Effort" [ref=f8e539]: S
                  - listitem [ref=f8e541]:
                    - generic [aria-hidden] [ref=f8e545]: 󱇘
                    - generic [ref=f8e546]:
                      - strong [ref=f8e547]: OrigamSection — section schemas
                      - paragraph [ref=f8e548]: "OrigamSection was removed from the repository on 2026-08-26 — it was an empty 14-line shell with no shipped value. This milestone creates it from scratch: predefined section schemas such as hero, split, centered or full-bleed, as overridable prop presets on a real section element, props-first."
                    - generic "Effort" [ref=f8e549]: M
                  - listitem [ref=f8e551]:
                    - generic [aria-hidden] [ref=f8e555]: 󰪐
                    - generic [ref=f8e556]:
