                      - strong [ref=f8e441]: Unit test suite consolidation
                      - paragraph [ref=f8e442]: Standardize on a single tests/unit//.spec.ts convention and lift branch coverage on the transversal composables, mocking CSS.supports in jsdom.
                    - generic "Effort" [ref=f8e443]: M
                  - listitem [ref=f8e445]:
                    - generic [aria-hidden] [ref=f8e449]: 󰱽
                    - generic [ref=f8e450]:
                      - strong [ref=f8e451]: Pre-v3 API audit
                      - paragraph [ref=f8e452]: A full deprecation inventory in the v2-to-v3 migration guide, missing @deprecated markers completed, and a codemod for the mechanical renames.
                    - generic "Effort" [ref=f8e453]: L
