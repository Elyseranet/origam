                    - generic [ref=f8e430]:
                      - strong [ref=f8e431]: Bundle-size monitoring
                      - paragraph [ref=f8e432]: size-limit on every sub-export. PR comments auto-generated. The 5.6 MB → 869 kB drop must stay an asset.
                    - generic "Effort" [ref=f8e433]: S
