            - paragraph [ref=f8e345]: WHAT'S NEXT
            - heading "A phased roadmap." [level=2] [ref=f8e346]
            - paragraph [ref=f8e347]: Each phase builds on the previous. The order reflects real technical dependencies, not arbitrary milestones.
          - list "A phased roadmap." [ref=f8e348]:
            - listitem [ref=f8e349]:
              - generic [aria-hidden] [ref=f8e352]: 󱓟
              - generic [ref=f8e355]:
                - generic [ref=f8e359]:
