  - main [ref=f3e58]:
    - article [ref=f3e60]:
      - region [ref=f3e61]:
        - generic [ref=f3e62]:
          - generic [ref=f3e63]: Mesuré, pas rédigé
          - heading "Confidentialité" [level=1] [ref=f3e65]
          - paragraph [ref=f3e66]: Cette page n’énonce que ce qui a été vérifié dans le code source de ce site, et en chargeant une page avec le journal réseau ouvert. Elle est volontairement courte — il y a très peu à signaler. Chaque affirmation nomme ce qu’elle décrit, pour que vous puissiez la vérifier vous-même dans votre navigateur.
      - region [ref=f3e67]:
        - generic [ref=f3e68]:
          - heading "Ce qui n’est pas collecté" [level=2] [ref=f3e69]
          - paragraph [ref=f3e70]: "Il n’y a sur ce site aucun analytics, aucun pixel de suivi et aucun script de mesure tiers. Rien n’enregistre les pages que vous consultez, le temps que vous y passez, ni d’où vous venez. Aucun compte visiteur n’existe : rien n’est rattaché à une identité."
      - region [ref=f3e71]:
        - generic [ref=f3e72]:
          - heading "Cookies" [level=2] [ref=f3e73]
          - paragraph [ref=f3e74]: "La navigation sur ce site ne pose de cookies que pour deux choses, toutes deux des préférences que vous avez choisies vous-même :"
          - list [ref=f3e75]:
            - listitem [ref=f3e76]: origam_locale — la langue d’affichage, pour que le site ne revienne pas à l’anglais à votre prochaine visite.
            - listitem [ref=f3e77]: origam-theme et origam-mode — le thème et l’apparence claire ou sombre que vous avez sélectionnés.
          - paragraph [ref=f3e78]: Un cookie de session distinct existe pour l’espace d’administration privé. Il est créé en s’y connectant, jamais en naviguant sur le site public.
      - region [ref=f3e79]:
        - generic [ref=f3e80]:
          - heading "Stockage local" [level=2] [ref=f3e81]
          - paragraph [ref=f3e82]: "Le constructeur de thème enregistre votre travail en cours dans votre navigateur, sous la clé origam_theme_builder_state, aux côtés de origam-theme et origam-mode pour votre choix d’apparence. Ces entrées ne quittent jamais le navigateur : elles ne sont envoyées à aucun serveur, et effacer les données du site les supprime."
      - region [ref=f3e83]:
        - generic [ref=f3e84]:
          - heading "Formulaires et recherche" [level=2] [ref=f3e85]
          - paragraph [ref=f3e86]: "Ce site ne comporte qu’un seul formulaire — le panneau de propriétés du constructeur de thème — et il ne soumet rien : il modifie un aperçu à l’intérieur de la page. Le champ de recherche filtre un catalogue que votre navigateur a déjà téléchargé ; ce que vous y tapez n’est donc envoyé nulle part."
      - region [ref=f3e87]:
        - generic [ref=f3e88]:
          - heading "Le seul tiers" [level=2] [ref=f3e89]
          - paragraph [ref=f3e90]: Les polices de caractères sont chargées depuis Google Fonts sur chaque page — fonts.googleapis.com pour la feuille de style, fonts.gstatic.com pour les fichiers de police. Votre navigateur effectue donc une requête vers Google, ce qui leur révèle votre adresse IP et votre navigateur, comme sur tout site utilisant ce service. C’est le seul hôte externe contacté automatiquement.
          - separator [ref=f3e91]
          - paragraph [ref=f3e92]: Les autres adresses externes de ce site — le dépôt GitHub, la page de don, Discord — sont de simples liens. Rien ne leur est demandé tant que vous ne cliquez pas.
      - region [ref=f3e93]:
        - generic [ref=f3e94]:
          - heading "Comment cette page a été établie" [level=2] [ref=f3e95]
          - paragraph [ref=f3e96]: Chaque affirmation ci-dessus provient de la lecture du code source de ce site et du chargement d’une page dans un navigateur, journal réseau ouvert — pas d’un modèle type. Rien n’y a été supposé.
          - paragraph [ref=f3e97]: Elle décrit le comportement de l’application elle-même. Ce que le serveur qui l’héberge enregistre au niveau réseau n’a pas été mesuré, et n’est donc pas décrit ici.
          - paragraph [ref=f3e98]: Dernière vérification par rapport au code source le 16 septembre 2026.
