  - main [ref=f2e58]:
    - article [ref=f2e60]:
      - region [ref=f2e61]:
        - generic [ref=f2e62]:
          - generic [ref=f2e63]: Measured, not drafted
          - heading "Privacy" [level=1] [ref=f2e65]
          - paragraph [ref=f2e66]: This page lists only what was verified in the source code of this site, and by loading a page with the network log open. It is deliberately short — there is very little to report. Each statement names the thing it describes, so you can check it yourself in your browser.
      - region [ref=f2e67]:
        - generic [ref=f2e68]:
          - heading "What is not collected" [level=2] [ref=f2e69]
          - paragraph [ref=f2e70]: There is no analytics, no tracking pixel and no third-party measurement script anywhere on this site. Nothing records which pages you visit, how long you stay, or where you arrived from. No visitor account exists, so nothing is attached to an identity.
      - region [ref=f2e71]:
        - generic [ref=f2e72]:
          - heading "Cookies" [level=2] [ref=f2e73]
          - paragraph [ref=f2e74]: "Browsing this site sets cookies for two things only, both of them preferences you chose yourself:"
          - list [ref=f2e75]:
            - listitem [ref=f2e76]: origam_locale — the display language, so the site does not revert to English on your next visit.
            - listitem [ref=f2e77]: origam-theme and origam-mode — the theme and the light or dark appearance you selected.
          - paragraph [ref=f2e78]: A separate session cookie exists for the private administration area. It is created by logging in there and never by browsing the public site.
      - region [ref=f2e79]:
        - generic [ref=f2e80]:
          - heading "Local storage" [level=2] [ref=f2e81]
          - paragraph [ref=f2e82]: "The theme builder saves your work in progress in your browser, under the key origam_theme_builder_state, alongside origam-theme and origam-mode for your appearance choice. These entries never leave the browser: they are not sent to any server, and clearing the site data removes them."
      - region [ref=f2e83]:
        - generic [ref=f2e84]:
          - heading "Forms and search" [level=2] [ref=f2e85]
          - paragraph [ref=f2e86]: "This site carries a single form — the property panel of the theme builder — and it submits nothing: it edits a preview inside the page. The search field filters a catalogue your browser has already downloaded, so what you type into it is never sent anywhere."
      - region [ref=f2e87]:
        - generic [ref=f2e88]:
          - heading "The one third party" [level=2] [ref=f2e89]
          - paragraph [ref=f2e90]: Typefaces are loaded from Google Fonts on every page — fonts.googleapis.com for the stylesheet, fonts.gstatic.com for the font files. Your browser therefore makes a request to Google, which reveals your IP address and browser to them, as it does on any site using that service. It is the only external host contacted automatically.
          - separator [ref=f2e91]
          - paragraph [ref=f2e92]: The other external addresses on this site — the GitHub repository, the donation page, Discord — are ordinary links. Nothing is requested from them unless you click.
      - region [ref=f2e93]:
        - generic [ref=f2e94]:
          - heading "How this page was established" [level=2] [ref=f2e95]
          - paragraph [ref=f2e96]: Every statement above comes from reading the source code of this site and from loading a page in a browser with the network log open — not from a template. Nothing here was assumed.
          - paragraph [ref=f2e97]: It describes the behaviour of the application itself. What the server hosting it records at the network level was not measured, and is therefore not described here.
          - paragraph [ref=f2e98]: Last verified against the source code on 16 September 2026.
