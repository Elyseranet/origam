name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel in-flight runs on the same ref. Tags / release pushes are
# excluded so a release run is never cancelled by a rebase.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: 0
  CI: true
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint (no auto-fix)
        run: pnpm exec eslint . --ext .vue,.js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts --max-warnings 0

  type-check:
    name: Type-check (vue-tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generated token types (src/types/tokens.type.ts) are imported across the
      # DS source; rebuild them so vue-tsc resolves every reference.
      - name: Build tokens (prereq for type resolution)
        run: pnpm -F origam tokens:build

      # Hard gate: the DS must stay at ZERO vue-tsc errors. This locks in the
      # #65 type-debt cleanup (262 -> 0) and fails the build on any regression.
      - name: vue-tsc --noEmit
        run: pnpm -F origam run type-check

      # `noUnusedLocals` is temporarily OFF on the DS (TS 6 x @vue/language-core
      # false-positives on template refs). This canary fails once the upstream
      # engine is fixed, forcing us to re-enable the flag. See the script header.
      - name: noUnusedLocals re-enable canary
        run: pnpm -F origam run type-check:canary

  tokens:
    name: Tokens build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tokens JSON
        run: |
          for f in packages/ds/tokens/*.json packages/ds/tokens/semantic/*.json packages/ds/tokens/component/*.json; do
            [ -f "$f" ] || continue
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "::error file=$f::Invalid JSON"; exit 1; }
          done

      - name: Tokens lint (strict)
        run: pnpm -F origam tokens:lint

      - name: Tokens build
        run: pnpm -F origam tokens:build

      - name: Upload generated token artefacts
        uses: actions/upload-artifact@v7
        with:
          name: tokens-dist
          path: |
            packages/ds/src/assets/css/tokens
            packages/ds/src/assets/scss/tokens
            packages/ds/src/types/tokens.type.ts
          retention-days: 7
          if-no-files-found: error

  test-unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    needs: tokens
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens (prereq for component tests)
        run: pnpm -F origam tokens:build

      # `test:coverage` et non `test:unit:run` : le provider V8 traverse
      # `test-exclude` -> `glob` -> `minimatch`, un chemin que la suite nue
      # n'emprunte jamais. C'est exactement ce qui a laisse passer la
      # regression `brace-expansion` (#301/#307) : 10 checks verts sur une PR,
      # et le workflow `Build` casse immediatement apres le merge sur develop.
      # Le surcout mesure est de l'ordre de +30 % sur ce job — le prix d'un
      # filet qui manquait. Cf. #308.
      - name: Vitest (avec couverture)
        run: pnpm -F @origam/tests test:coverage

  build:
    name: Library build (unbuild)
    runs-on: ubuntu-latest
    needs: tokens
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm -F origam build

      - name: Assert dist output exists
        run: |
          test -d packages/ds/dist/src || { echo "::error::packages/ds/dist/src missing after build"; exit 1; }
          test -f packages/ds/dist/src/origam.js \
            || { echo "::error::packages/ds/dist/src/origam.js missing — entry not emitted"; exit 1; }

      - name: Upload library dist
        uses: actions/upload-artifact@v7
        with:
          name: library-dist
          path: packages/ds/dist/
          retention-days: 7
          if-no-files-found: error

  build-embeds:
    name: Build embeds (stories + docs)
    runs-on: ubuntu-latest
    needs: tokens
    # The Histoire stories build (209 stories, large vendor chunk) needs more
    # heap than the workflow-level 4096 MB default.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens (the docs theme imports the generated token CSS)
        run: pnpm -F origam tokens:build

      - name: Build embeds (Histoire stories + VitePress docs)
        run: pnpm run build:embeds

      - name: Assert embeds output exists
        run: |
          test -f packages/marketing/public/stories/index.html \
            || { echo "::error::stories embed missing — public/stories/index.html not built"; exit 1; }
          test -f packages/marketing/public/docs/index.html \
            || { echo "::error::docs embed missing — public/docs/index.html not built"; exit 1; }

      - name: Upload marketing embeds
        uses: actions/upload-artifact@v7
        with:
          name: marketing-embeds
          path: |
            packages/marketing/public/stories
            packages/marketing/public/docs
          retention-days: 7
          if-no-files-found: error

  build-marketing:
    name: Build marketing (Nuxt)
    runs-on: ubuntu-latest
    needs: tokens
    # No GHA/docker.yml job builds the marketing image (it only ships docs +
    # stories, and only on `main`/tags) — Coolify was the only thing building
    # it on every `develop` push, and its failures never surfaced on GitHub.
    # This job is the guard: it runs the same `nuxt build` Coolify's Docker
    # image runs, on a full checkout, so a broken marketing build goes red
    # here instead of only at deploy time. See postmortem: a stale root
    # tsconfig project reference (fixed in 29e9c1b7) broke every Coolify
    # deploy on `develop` for days while this workflow stayed green, because
    # nothing here ever ran `pnpm -F @origam/marketing build`.
    #
    # Deliberately narrow: builds the lib (marketing imports `origam`) then
    # the Nuxt app directly, skipping `build:embeds` (Histoire + VitePress,
    # ~70s+ on its own, already covered by `build-embeds` above). The embeds
    # are static assets copied into `public/`; nothing in `nuxt.config.ts` or
    # the build pipeline reads them at build time, so omitting them doesn't
    # lose any coverage — confirmed by reproducing the original incident
    # (renaming packages/tests/{TU,e2e}/tsconfig.json) with embeds skipped
    # and still seeing `nuxt build` fail with the same
    # `[TSCONFIG_ERROR] ... Tsconfig not found`.
    env:
      # Matches packages/marketing/Dockerfile's build stage: the Nitro build
      # (server bundle + SSR payload) OOMs on the workflow-level 4096 MB.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library (marketing imports `origam`)
        run: pnpm -F origam build

      - name: Build marketing (Nuxt)
        run: pnpm -F @origam/marketing build

      - name: Assert Nuxt output exists
        run: |
          test -f packages/marketing/.output/server/index.mjs \
            || { echo "::error::packages/marketing/.output/server/index.mjs missing — Nitro server entry not emitted"; exit 1; }

  i18n-check:
    name: i18n check (marketing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Checks 1 (missing key definitions) and 2 (EN/FR parity) run in
      # WARNING mode: ~400 referenced keys are missing and ~93 FR values
      # disagree with EN today (see scripts/i18n-check.mjs header for the
      # gating rationale — flipping this to blocking now would make the job
      # red on day one). Check 3 (zero hardcoded strings in .vue templates)
      # is BLOCKING and starts clean, so any regression fails this job.
      - name: i18n check (marketing)
        run: pnpm -F @origam/marketing i18n:check

  test-e2e:
    name: E2E tests (Playwright / Chromium)
    runs-on: ubuntu-latest
    needs: tokens
    # The GREEN_SPECS suite exceeds a single runner's 45-min budget even at
    # workers=100%. Shard it across parallel jobs (Playwright `--shard=i/N`);
    # each job runs ~1/N of the tests, so wall-clock drops well under the
    # timeout. fail-fast:false so one shard's failure doesn't cancel the others.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 30
    # E2E_GREEN_ONLY: run only the specs migrated to the unified-story format
    #   (GREEN_SPECS in playwright.config.ts); grows wave by wave.
    # E2E_STATIC: serve the PREBUILT static Histoire (built below) via
    #   `histoire preview` instead of `histoire dev`. No per-story Vite
    #   cold-compile → deterministic + parallel-safe, so the job stops timing
    #   out. NODE_OPTIONS bumps heap for the Histoire build.
    env:
      E2E_GREEN_ONLY: '1'
      E2E_STATIC: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(node -p "require('./packages/tests/package.json').devDependencies['@playwright/test'].replace(/[^\d.]/g,'')")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm -F @origam/tests exec playwright install --with-deps chromium

      - name: Install Playwright OS deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm -F @origam/tests exec playwright install-deps chromium

      - name: Build tokens
        run: pnpm -F origam tokens:build

      - name: Build static Histoire (served by the e2e webServer)
        run: pnpm -F @origam/stories build

      - name: Run Playwright (chromium)
        run: pnpm -F @origam/tests exec playwright test --project=chromium --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            packages/tests/e2e/.report
            packages/tests/e2e/.results
          retention-days: 7
          if-no-files-found: ignore

  vrt:
    name: Visual regression (OrigamBtn variants)
    runs-on: ubuntu-latest
    needs: tokens
    timeout-minutes: 15
    # Runs INSIDE the pinned Playwright image — not on the bare runner OS
    # via `playwright install --with-deps` like `test-e2e` above. Visual
    # baselines are font/anti-aliasing sensitive (see packages/tests/vrt/VRT.md);
    # pinning the exact container used to CAPTURE the baselines is what
    # makes this job's verdict meaningful. Keep the tag in sync with
    # packages/tests/package.json's @playwright/test version — a version
    # bump there without bumping this tag re-introduces the exact drift
    # this job exists to eliminate.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    env:
      E2E_STATIC: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm -F origam tokens:build

      - name: Build static Histoire (served by the vrt webServer)
        run: pnpm -F @origam/stories build

      - name: Run VRT suite (chromium, in-container)
        run: pnpm -F @origam/tests exec playwright test --config=playwright.vrt.config.ts

      - name: Upload VRT report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-vrt
          path: |
            packages/tests/vrt/.report
            packages/tests/vrt/.results
          retention-days: 7
          if-no-files-found: ignore
